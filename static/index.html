<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --surface-sunken: #fafbfc;
    --border: #e3e6eb;
    --border-strong: #cdd2db;
    --text: #1a1f2b;
    --text-muted: #667085;
    --text-faint: #98a1b0;
    --primary: #3e5bf0;
    --primary-hover: #3149cf;
    --primary-tint: #eef0fe;
    --success: #17875a;
    --success-tint: #e6f5ee;
    --info: #0f8a8a;
    --info-tint: #e6f6f6;
    --danger: #d13a3a;
    --danger-tint: #fbebeb;
    --shadow: 0 1px 2px rgba(20, 24, 33, 0.04), 0 8px 24px -12px rgba(20, 24, 33, 0.12);
    --font-ui: "Inter", system-ui, -apple-system, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d0f14;
      --surface: #14161e;
      --surface-sunken: #10121a;
      --border: #262a37;
      --border-strong: #343948;
      --text: #eaecf1;
      --text-muted: #9298a8;
      --text-faint: #5d6376;
      --primary: #6b82ff;
      --primary-hover: #8496ff;
      --primary-tint: #1c2246;
      --success: #3ecf8e;
      --success-tint: #123527;
      --info: #3fc6c6;
      --info-tint: #103333;
      --danger: #f0665f;
      --danger-tint: #3a1c1c;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 28px -14px rgba(0, 0, 0, 0.6);
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    -webkit-font-smoothing: antialiased;
  }

  .app {
    max-width: 980px;
    margin: 0 auto;
    padding: 28px 24px 64px;
  }

  /* --- topbar --- */

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 22px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand .mark {
    width: 26px;
    height: 26px;
    border-radius: 7px;
    background: var(--primary);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .brand .mark svg { width: 15px; height: 15px; fill: #fff; }

  .brand h1 {
    font-size: 15px;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.01em;
  }

  .conn-pill {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 5px 11px;
    border-radius: 100px;
    border: 1px solid var(--border);
    background: var(--surface);
    font-size: 12.5px;
    color: var(--text-muted);
    font-weight: 500;
  }

  .led {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--text-faint);
    flex-shrink: 0;
    transition: background-color 200ms ease, box-shadow 200ms ease;
  }
  .led.on-listening { background: var(--success); box-shadow: 0 0 0 3px var(--success-tint); }
  .led.on-speaking { background: var(--info); box-shadow: 0 0 0 3px var(--info-tint); }
  .led.on-error { background: var(--danger); box-shadow: 0 0 0 3px var(--danger-tint); }

  /* --- layout --- */

  .layout {
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 18px;
    align-items: start;
  }

  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; }
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: var(--shadow);
  }

  /* --- status card --- */

  .status-card { padding: 20px; }

  .status-row {
    display: flex;
    align-items: center;
    gap: 13px;
  }

  .status-tile {
    width: 44px;
    height: 44px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    background: var(--surface-sunken);
    border: 1px solid var(--border);
    color: var(--text-faint);
    transition: background-color 200ms ease, color 200ms ease, border-color 200ms ease;
  }
  .status-tile svg { width: 20px; height: 20px; }

  .status-tile.listening { background: var(--success-tint); border-color: transparent; color: var(--success); }
  .status-tile.speaking { background: var(--info-tint); border-color: transparent; color: var(--info); animation: tile-pulse 1s ease-in-out infinite; }
  .status-tile.error { background: var(--danger-tint); border-color: transparent; color: var(--danger); }
  .status-tile.muted { background: var(--surface-sunken); color: var(--text-faint); }

  @keyframes tile-pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }
  @media (prefers-reduced-motion: reduce) {
    .status-tile.speaking { animation: none; }
  }

  .status-copy .state-text {
    font-size: 14px;
    font-weight: 600;
    text-transform: capitalize;
  }
  .status-copy .status-label {
    font-size: 12.5px;
    color: var(--text-muted);
    margin-top: 1px;
  }

  .actions {
    display: flex;
    gap: 8px;
    margin-top: 16px;
  }

  button.primary {
    flex: 1;
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid transparent;
    font-family: var(--font-ui);
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    background: var(--primary);
    color: #fff;
    transition: background-color 120ms ease, transform 80ms ease;
  }
  button.primary:hover:not(:disabled) { background: var(--primary-hover); }
  button.primary:active:not(:disabled) { transform: scale(0.99); }
  button.primary:disabled { cursor: not-allowed; opacity: 0.55; }

  button.primary.disconnect { background: var(--surface); color: var(--text); border-color: var(--border-strong); }
  button.primary.disconnect:hover:not(:disabled) { border-color: var(--danger); color: var(--danger); background: var(--danger-tint); }

  button.secondary {
    width: 84px;
    padding: 10px 8px;
    border-radius: 8px;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--text);
    font-family: var(--font-ui);
    font-size: 13.5px;
    font-weight: 500;
    cursor: pointer;
    transition: border-color 120ms ease, color 120ms ease, background-color 120ms ease;
  }
  button.secondary:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
  button.secondary:disabled { cursor: not-allowed; opacity: 0.45; }
  button.secondary.active { border-color: var(--danger); color: var(--danger); background: var(--danger-tint); }

  /* --- settings disclosure --- */

  .settings-panel { margin-top: 14px; padding: 6px 20px 18px; }

  .settings-panel summary {
    list-style: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 0;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
  }
  .settings-panel summary::-webkit-details-marker { display: none; }
  .settings-panel summary .chev { color: var(--text-faint); transition: transform 150ms ease; }
  .settings-panel[open] summary .chev { transform: rotate(90deg); }

  .settings-body { padding-top: 6px; display: grid; gap: 18px; }

  .field-group {
    display: grid;
    gap: 10px;
  }

  .field-group h3 {
    margin: 0;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--text-faint);
    letter-spacing: 0.01em;
  }

  .field { display: grid; gap: 5px; }

  .field label {
    font-size: 12.5px;
    color: var(--text-muted);
  }

  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  select, input[type="text"], input[type="number"] {
    width: 100%;
    background: var(--surface-sunken);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text);
    font-family: var(--font-ui);
    font-size: 13px;
    padding: 8px 10px;
    outline: none;
    transition: border-color 150ms ease, box-shadow 150ms ease;
  }
  select:focus, input[type="text"]:focus, input[type="number"]:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-tint);
  }
  select:disabled, input:disabled { opacity: 0.5; cursor: not-allowed; }
  input[type="text"]::placeholder { color: var(--text-faint); }
  input[type="number"] { font-variant-numeric: tabular-nums; }

  /* --- transcript --- */

  .transcript-panel { display: flex; flex-direction: column; min-height: 420px; }

  .transcript-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
  }
  .transcript-header h2 { margin: 0; font-size: 13.5px; font-weight: 600; }
  .transcript-header .count {
    font-size: 11.5px;
    color: var(--text-faint);
    font-family: var(--font-mono);
  }

  .transcript {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px 20px;
    font-family: var(--font-mono);
    font-size: 13px;
    line-height: 1.7;
    scrollbar-width: thin;
    scrollbar-color: var(--border-strong) transparent;
  }

  .transcript:empty::before {
    content: "Conversation will appear here once you connect.";
    color: var(--text-faint);
    font-family: var(--font-ui);
  }

  .line { display: flex; gap: 10px; margin-bottom: 6px; }
  .line .who { flex-shrink: 0; width: 38px; text-align: right; font-weight: 600; font-size: 12px; padding-top: 1px; }
  .line.you .who { color: var(--primary); }
  .line.bot .who { color: var(--info); }
  .line .what { color: var(--text); white-space: pre-wrap; word-break: break-word; }
  .line.system { color: var(--text-faint); font-style: italic; }
  .line.system .who { color: var(--text-faint); }

  .text-compose {
    display: flex;
    gap: 8px;
    padding: 12px 20px;
    border-top: 1px solid var(--border);
  }
  .text-compose input[type="text"] { flex: 1; }
  .text-compose button.primary { flex: none; width: 84px; }

  .line-stats {
    font-size: 11px;
    color: var(--text-faint);
    font-family: var(--font-mono);
    margin: -2px 0 8px 48px;
  }
</style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="brand">
        <span class="mark"><svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z"/></svg></span>
        <h1>Voice Agent</h1>
      </div>
      <div style="display:flex;align-items:center;gap:10px;">
        <button class="secondary" id="historyBtn" style="width:auto;padding:6px 14px;">History</button>
        <div class="conn-pill"><span class="led" id="led"></span><span id="stateText">Disconnected</span></div>
      </div>
    </div>

    <div class="layout">
      <div>
        <div class="panel status-card">
          <div class="status-row">
            <div class="status-tile" id="ring"><span id="ringIcon"></span></div>
            <div class="status-copy">
              <div class="state-text" id="stateTextCard">Disconnected</div>
              <div class="status-label" id="statusLabel">Not connected</div>
            </div>
          </div>
          <div class="actions">
            <button class="primary" id="connectBtn">Connect</button>
            <button class="secondary" id="muteBtn" disabled>Mute</button>
          </div>
        </div>

        <details class="panel settings-panel" id="settingsPanel">
          <summary>Voice &amp; model settings <span class="chev">&#8250;</span></summary>
          <div class="settings-body" id="configPanel">
            <div class="field-group">
              <h3>Session type</h3>
              <div class="field">
                <label for="modeSelect">Mode</label>
                <select id="modeSelect">
                  <option value="voice">Voice</option>
                  <option value="text">Text</option>
                </select>
              </div>
            </div>

            <div class="field-group">
              <h3>Model</h3>
              <div class="field">
                <label for="ttsEngine">Voice engine</label>
                <select id="ttsEngine"></select>
              </div>
              <div class="field">
                <label for="ttsVoice">Voice</label>
                <select id="ttsVoice"></select>
              </div>
              <div class="field">
                <label for="llmModel">LLM model</label>
                <select id="llmModel"></select>
              </div>
            </div>

            <div class="field-group">
              <h3>Input</h3>
              <div class="field">
                <label for="micSelect">Microphone</label>
                <select id="micSelect"><option value="">System default</option></select>
              </div>
              <div class="field">
                <label for="triggerWord">Wake word (optional)</label>
                <input type="text" id="triggerWord" placeholder="e.g. computer">
              </div>
            </div>

            <div class="field-group">
              <h3>Voice detection</h3>
              <div class="field">
                <label for="vadThreshold">Sensitivity (0&ndash;1)</label>
                <input type="number" id="vadThreshold" min="0" max="1" step="0.05" value="0.5">
              </div>
              <div class="field-row">
                <div class="field">
                  <label for="vadMinSilenceMs">Pause length (ms)</label>
                  <input type="number" id="vadMinSilenceMs" min="0" step="100" value="1200">
                </div>
                <div class="field">
                  <label for="vadSpeechPadMs">Speech padding (ms)</label>
                  <input type="number" id="vadSpeechPadMs" min="0" step="50" value="300">
                </div>
              </div>
            </div>
          </div>
        </details>
      </div>

      <div class="panel transcript-panel">
        <div class="transcript-header">
          <h2>Conversation</h2>
          <span class="count" id="lineCount"></span>
        </div>
        <div class="transcript" id="transcript"></div>
        <div class="text-compose" id="textCompose" hidden>
          <input type="text" id="textInput" placeholder="Type a message…" disabled>
          <button class="primary" id="textSendBtn" disabled>Send</button>
        </div>
      </div>
    </div>

    <div class="panel" id="historyModal" hidden style="position:fixed;inset:40px;z-index:10;overflow-y:auto;max-width:640px;margin:0 auto;">
      <div class="transcript-header">
        <h2 id="historyTitle">History</h2>
        <button class="secondary" id="historyCloseBtn" style="width:auto;padding:4px 10px;">Close</button>
      </div>
      <div id="historyBody" style="padding:16px 20px;"></div>
    </div>
  </div>

<script>
(() => {
  const el = (id) => document.getElementById(id);
  const led = el("led"), ring = el("ring"), ringIcon = el("ringIcon");
  const stateText = el("stateText"), stateTextCard = el("stateTextCard"), statusLabel = el("statusLabel");
  const configPanel = el("configPanel"), connectBtn = el("connectBtn"), muteBtn = el("muteBtn");
  const ttsEngineSel = el("ttsEngine"), ttsVoiceSel = el("ttsVoice"), llmModelSel = el("llmModel");
  const triggerInput = el("triggerWord"), micSelect = el("micSelect");
  const vadThresholdInput = el("vadThreshold"), vadMinSilenceInput = el("vadMinSilenceMs"), vadSpeechPadInput = el("vadSpeechPadMs");
  const transcript = el("transcript"), lineCount = el("lineCount");
  const settingsPanel = el("settingsPanel");
  const historyBtn = el("historyBtn"), historyModal = el("historyModal");
  const historyTitle = el("historyTitle"), historyBody = el("historyBody"), historyCloseBtn = el("historyCloseBtn");
  const modeSelect = el("modeSelect");
  const textCompose = el("textCompose"), textInput = el("textInput"), textSendBtn = el("textSendBtn");

  const ICONS = {
    idle: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z" opacity="0.5"/></svg>',
    listening: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z"/></svg>',
    speaking: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="10" width="2.5" height="4" rx="1"/><rect x="9" y="6" width="2.5" height="12" rx="1"/><rect x="14" y="3" width="2.5" height="18" rx="1"/><rect x="19" y="8" width="2.5" height="8" rx="1"/></svg>',
    muted: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.5 12a4.5 4.5 0 0 0-.2-1.3l-1.5 1.5v-.2H12.8L16.5 15.7A4.48 4.48 0 0 0 16.5 12ZM19 12a7 7 0 0 1-.68 3l1.45 1.45A8.96 8.96 0 0 0 21 12h-2ZM4.27 3 3 4.27l6 6V12a3 3 0 0 0 4.55 2.57l1.2 1.2A4.98 4.98 0 0 1 7 12H5a7 7 0 0 0 6 6.92V21h2v-2.08a6.96 6.96 0 0 0 2.61-.88L19.73 22 21 20.73 4.27 3ZM15 6a3 3 0 0 0-6 0v1.79l6 6V6Z"/></svg>',
    error: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 1 21h22L12 2Zm1 15h-2v2h2v-2Zm0-7h-2v5h2v-5Z"/></svg>',
  };

  function isTextMode() {
    return modeSelect.value === "text";
  }

  let options = null;
  let ws = null, connected = false, micMuted = false, currentState = "idle";
  let audioCtx, micStream, source, processor, playCtx;
  let outputSampleRate = 16000;
  let nextPlayTime = 0; // running Web Audio timeline cursor for gapless playback scheduling
  let turnCount = 0;
  let totalTokens = 0, totalCost = 0, totalCostKnown = false;

  function formatUsageLine(usage) {
    const parts = [];
    if (usage.input_tokens != null && usage.output_tokens != null) {
      const totalPart = usage.context_window != null
        ? `${usage.total_tokens} total / ${usage.context_window} ctx`
        : `${usage.total_tokens} total`;
      parts.push(`${usage.input_tokens} in / ${usage.output_tokens} out (${totalPart})`);
    }
    if (usage.cost_usd != null) parts.push(`$${usage.cost_usd.toFixed(4)}`);
    if (usage.tool_calls && usage.tool_calls.length) {
      parts.push(`tools: ${usage.tool_calls.map((c) => c.name).join(", ")}`);
    }
    return parts.join(" · ");
  }

  function updateSessionTotals(usage) {
    if (usage.total_tokens != null) totalTokens += usage.total_tokens;
    if (usage.cost_usd != null) { totalCost += usage.cost_usd; totalCostKnown = true; }
    const tokenPart = totalTokens ? `${totalTokens.toLocaleString()} tokens` : "";
    const costPart = totalCostKnown ? `$${totalCost.toFixed(4)}` : "";
    lineCount.textContent = [tokenPart, costPart].filter(Boolean).join(" · ")
      || (turnCount ? `${turnCount}${turnCount === 1 ? " message" : " messages"}` : "");
  }

  // --- helpers ---

  function floatToPcm16(input) {
    const out = new Int16Array(input.length);
    for (let i = 0; i < input.length; i++) {
      const s = Math.max(-1, Math.min(1, input[i]));
      out[i] = s < 0 ? s * 32768 : s * 32767;
    }
    return out.buffer;
  }

  function pcm16ToFloat(buf) {
    const view = new Int16Array(buf);
    const out = new Float32Array(view.length);
    for (let i = 0; i < view.length; i++) out[i] = view[i] / 32768;
    return out;
  }

  function rms(float32) {
    let sum = 0;
    for (let i = 0; i < float32.length; i++) sum += float32[i] * float32[i];
    return Math.sqrt(sum / float32.length);
  }

  function addLine(who, text, usage) {
    const line = document.createElement("div");
    line.className = "line " + who;
    const label = { you: "You", bot: "Bot", system: "—" }[who] || who;
    line.innerHTML = `<span class="who">${label}</span><span class="what"></span>`;
    line.querySelector(".what").textContent = text;
    transcript.appendChild(line);

    if (usage) {
      const statsLine = formatUsageLine(usage);
      if (statsLine) {
        const stats = document.createElement("div");
        stats.className = "line-stats";
        stats.textContent = statsLine;
        transcript.appendChild(stats);
      }
      updateSessionTotals(usage);
    }

    transcript.scrollTop = transcript.scrollHeight;
    if (who === "you" || who === "bot") {
      turnCount++;
      if (!usage) lineCount.textContent = turnCount + (turnCount === 1 ? " message" : " messages");
    }
  }

  function setState(state, label) {
    currentState = state;
    led.className = "led" + (state === "listening" ? " on-listening" : state === "speaking" ? " on-speaking" : state === "error" ? " on-error" : "");
    ring.className = "status-tile" + (state === "listening" ? " listening" : state === "speaking" ? " speaking" : state === "error" ? " error" : state === "muted" ? " muted" : "");
    ringIcon.innerHTML = ICONS[state] || ICONS.idle;
    const text = { idle: "Disconnected", connecting: "Connecting…", listening: "Listening", speaking: "Speaking", muted: "Muted", error: "Error" }[state] || state;
    stateText.textContent = text;
    stateTextCard.textContent = text;
    statusLabel.textContent = label;
  }

  function refreshIdleState() {
    if (!connected) return;
    if (micMuted) setState("muted", "Microphone is muted");
    else setState("listening", "Listening — just start talking");
  }

  // --- /options ---

  async function loadOptions() {
    const res = await fetch("/options");
    options = await res.json();

    ttsEngineSel.innerHTML = "";
    for (const engine of Object.keys(options.tts)) {
      const o = document.createElement("option");
      o.value = engine; o.textContent = engine;
      ttsEngineSel.appendChild(o);
    }
    ttsEngineSel.value = options.defaults.tts_engine;
    populateVoices();

    llmModelSel.innerHTML = "";
    for (const model of options.llm_models) {
      const o = document.createElement("option");
      o.value = model; o.textContent = model;
      llmModelSel.appendChild(o);
    }
    llmModelSel.value = options.defaults.llm_model;
  }

  function populateVoices() {
    const voices = options.tts[ttsEngineSel.value] || [];
    ttsVoiceSel.innerHTML = "";
    for (const voice of voices) {
      const o = document.createElement("option");
      o.value = voice; o.textContent = voice;
      ttsVoiceSel.appendChild(o);
    }
  }

  ttsEngineSel.addEventListener("change", populateVoices);

  // --- speaking detection: real signal in incoming audio, not just "any frame arrived"
  // (the sink streams continuously, silence included, once connected) ---

  let lastLoudAt = 0;
  let speakingCheckTimer = null;
  const LOUD_RMS = 0.01;
  const SPEAKING_HANGOVER_MS = 400;

  function noteIncomingAudio(float32) {
    if (rms(float32) > LOUD_RMS) {
      lastLoudAt = Date.now();
      if (connected) setState("speaking", "The assistant is talking");
    }
  }

  function startSpeakingWatchdog() {
    speakingCheckTimer = setInterval(() => {
      if (!connected) return;
      if (Date.now() - lastLoudAt > SPEAKING_HANGOVER_MS) refreshIdleState();
    }, 120);
  }

  function stopSpeakingWatchdog() {
    if (speakingCheckTimer) clearInterval(speakingCheckTimer);
    speakingCheckTimer = null;
  }

  // --- microphone selection ---

  async function populateMics() {
    try {
      const devices = await navigator.mediaDevices.enumerateDevices();
      const mics = devices.filter((d) => d.kind === "audioinput");
      const current = micSelect.value;
      micSelect.innerHTML = '<option value="">System default</option>';
      mics.forEach((d, i) => {
        const o = document.createElement("option");
        o.value = d.deviceId;
        o.textContent = d.label || `Microphone ${i + 1}`;
        micSelect.appendChild(o);
      });
      if (current) micSelect.value = current;
    } catch (e) {
      // enumerateDevices can fail (insecure context, unsupported browser) —
      // leave just the "System default" option, still fully usable.
    }
  }

  if (navigator.mediaDevices) navigator.mediaDevices.ondevicechange = populateMics;

  // --- mute ---

  function setMuted(value) {
    micMuted = value;
    muteBtn.textContent = micMuted ? "Unmute" : "Mute";
    muteBtn.classList.toggle("active", micMuted);
    if (micStream) micStream.getAudioTracks().forEach((t) => (t.enabled = !micMuted));
    if (currentState !== "speaking") refreshIdleState();
  }

  muteBtn.onclick = () => setMuted(!micMuted);

  // --- connect / disconnect ---

  async function connect() {
    connectBtn.disabled = true;
    const textMode = isTextMode();

    if (!textMode) {
      setState("connecting", "Opening the microphone…");
      const audioConstraints = micSelect.value ? { deviceId: { exact: micSelect.value } } : true;
      try {
        micStream = await navigator.mediaDevices.getUserMedia({ audio: audioConstraints });
      } catch (e) {
        setState("error", "Microphone access was denied");
        connectBtn.disabled = false;
        return;
      }
      populateMics(); // refresh with real labels now that permission is granted
    } else {
      setState("connecting", "Connecting…");
    }

    const params = new URLSearchParams();
    params.set("mode", textMode ? "text" : "voice");
    params.set("tts", ttsEngineSel.value);
    if (ttsVoiceSel.value) params.set("voice", ttsVoiceSel.value);
    params.set("llm_model", llmModelSel.value);
    if (triggerInput.value.trim()) params.set("trigger_word", triggerInput.value.trim());
    if (vadThresholdInput.value.trim()) params.set("vad_threshold", vadThresholdInput.value.trim());
    if (vadMinSilenceInput.value.trim()) params.set("vad_min_silence_ms", vadMinSilenceInput.value.trim());
    if (vadSpeechPadInput.value.trim()) params.set("vad_speech_pad_ms", vadSpeechPadInput.value.trim());

    const proto = location.protocol === "https:" ? "wss:" : "ws:";
    ws = new WebSocket(`${proto}//${location.host}/ws?${params.toString()}`);
    ws.binaryType = "arraybuffer";

    ws.onopen = () => {
      transcript.innerHTML = "";
      turnCount = 0;
      totalTokens = 0;
      totalCost = 0;
      totalCostKnown = false;
      lineCount.textContent = "";
    };

    ws.onclose = () => { if (connected) disconnect("Connection closed"); };
    ws.onerror = () => { setState("error", "Connection error"); };

    ws.onmessage = (event) => {
      if (typeof event.data === "string") {
        const msg = JSON.parse(event.data);
        handleEvent(msg);
        return;
      }
      const floatData = pcm16ToFloat(event.data);
      noteIncomingAudio(floatData);
      if (playCtx && floatData.length) {
        const buffer = playCtx.createBuffer(1, floatData.length, outputSampleRate);
        buffer.copyToChannel(floatData, 0);
        const src = playCtx.createBufferSource();
        src.buffer = buffer;
        src.connect(playCtx.destination);
        // Schedule back-to-back on a running timeline instead of
        // src.start() (= "play now" on every ~40ms block) — network
        // delivery isn't perfectly metronomic, so "now" causes
        // consecutive blocks to overlap or leave gaps at every boundary,
        // which is exactly what audible crackling sounds like. Falls
        // back to "now" naturally if playback ever falls behind (a gap
        // in the stream), since Math.max keeps it from scheduling in
        // the past.
        const startAt = Math.max(playCtx.currentTime, nextPlayTime);
        src.start(startAt);
        nextPlayTime = startAt + buffer.duration;
      }
    };

    if (!textMode) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
      source = audioCtx.createMediaStreamSource(micStream);
      processor = audioCtx.createScriptProcessor(512, 1, 1);
      processor.onaudioprocess = (e) => {
        if (!micMuted && ws && ws.readyState === WebSocket.OPEN) {
          ws.send(floatToPcm16(e.inputBuffer.getChannelData(0)));
        }
      };
      source.connect(processor);
      processor.connect(audioCtx.destination);
    }
  }

  function sendText() {
    const value = textInput.value.trim();
    if (!value || !ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({ text: value }));
    textInput.value = "";
  }

  textSendBtn.onclick = sendText;
  textInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendText();
  });

  function handleEvent(msg) {
    if (msg.event === "ready") {
      const textMode = isTextMode();
      if (!textMode) {
        outputSampleRate = msg.output_sample_rate;
        playCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: outputSampleRate });
        nextPlayTime = 0;
      }
      connected = true;
      configPanel.querySelectorAll("select, input").forEach((f) => (f.disabled = true));
      settingsPanel.open = false;
      connectBtn.textContent = "Disconnect";
      connectBtn.classList.add("disconnect");
      connectBtn.disabled = false;
      connectBtn.onclick = () => disconnect();
      if (textMode) {
        textCompose.hidden = false;
        textInput.disabled = false;
        textSendBtn.disabled = false;
        textInput.focus();
        setState("listening", "Type a message below");
      } else {
        muteBtn.disabled = false;
        setState("listening", "Listening — just start talking");
        startSpeakingWatchdog();
      }
    } else if (msg.event === "user_text") {
      addLine("you", msg.text);
    } else if (msg.event === "bot_text") {
      addLine("bot", msg.text, msg.usage);
    } else if (msg.event === "interrupted") {
      addLine("system", "Interrupted");
    } else if (msg.event === "error") {
      disconnect(msg.message || "Server rejected the connection");
    }
  }

  function disconnect(reason) {
    connected = false;
    setMuted(false);
    muteBtn.disabled = true;
    textCompose.hidden = true;
    textInput.disabled = true;
    textSendBtn.disabled = true;
    stopSpeakingWatchdog();
    if (processor) { processor.disconnect(); processor = null; }
    if (source) { source.disconnect(); source = null; }
    if (micStream) { micStream.getTracks().forEach((t) => t.stop()); micStream = null; }
    if (ws) { ws.onclose = null; ws.close(); ws = null; }

    configPanel.querySelectorAll("select, input").forEach((f) => (f.disabled = false));
    connectBtn.textContent = "Connect";
    connectBtn.classList.remove("disconnect");
    connectBtn.disabled = false;
    connectBtn.onclick = connect;
    setState("idle", reason || "Not connected");
  }

  // --- history panel ---

  async function openHistoryList() {
    historyTitle.textContent = "History";
    historyBody.innerHTML = "Loading…";
    historyModal.hidden = false;
    const sessions = await (await fetch("/sessions")).json();
    if (!sessions.length) {
      historyBody.textContent = "No past sessions yet.";
      return;
    }
    historyBody.innerHTML = "";
    for (const s of sessions) {
      const row = document.createElement("div");
      row.style.cssText = "padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer;";
      row.textContent = `${s.created_at}  ·  ${s.mode}  ·  ${s.turn_count} turns`;
      row.onclick = () => openHistoryDetail(s.id);
      historyBody.appendChild(row);
    }
  }

  async function openHistoryDetail(sessionId) {
    historyTitle.textContent = "Session " + sessionId.slice(0, 8);
    historyBody.innerHTML = "Loading…";
    const detail = await (await fetch(`/sessions/${sessionId}`)).json();
    historyBody.innerHTML = "";
    const back = document.createElement("button");
    back.className = "secondary";
    back.style.cssText = "width:auto;padding:4px 10px;margin-bottom:12px;";
    back.textContent = "← All sessions";
    back.onclick = openHistoryList;
    historyBody.appendChild(back);
    for (const turn of detail.turns) {
      const line = document.createElement("div");
      line.className = "line " + (turn.role === "user" ? "you" : "bot");
      const label = turn.role === "user" ? "You" : "Bot";
      line.innerHTML = `<span class="who">${label}</span><span class="what"></span>`;
      line.querySelector(".what").textContent = turn.text;
      historyBody.appendChild(line);
      if (turn.usage) {
        const statsLine = formatUsageLine(turn.usage);
        if (statsLine) {
          const stats = document.createElement("div");
          stats.className = "line-stats";
          stats.textContent = statsLine;
          historyBody.appendChild(stats);
        }
      }
    }
  }

  historyBtn.onclick = openHistoryList;
  historyCloseBtn.onclick = () => { historyModal.hidden = true; };

  connectBtn.onclick = connect;
  setState("idle", "Not connected");
  loadOptions().catch(() => setState("error", "Couldn't reach the server for options"));
  populateMics();
})();
</script>
</body>
</html>
