<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --sidebar-bg: #f9f9f9;
    --surface-sunken: #f4f4f5;
    --border: #e5e5e5;
    --text: #0d0d0d;
    --text-muted: #6e6e80;
    --text-faint: #9b9ba1;
    --accent: #10a37f;
    --accent-hover: #0d8f6f;
    --accent-tint: #e6f5f1;
    --danger: #d93025;
    --danger-tint: #fdeceb;
    --user-bubble: #f4f4f5;
    --shadow: 0 4px 14px -6px rgba(13, 13, 13, 0.12);
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #212121;
      --sidebar-bg: #171717;
      --surface-sunken: #2f2f2f;
      --border: #383838;
      --text: #ececec;
      --text-muted: #9b9b9b;
      --text-faint: #6e6e6e;
      --accent: #19c37d;
      --accent-hover: #29d68e;
      --accent-tint: #123529;
      --danger: #f0665f;
      --danger-tint: #3a1c1c;
      --user-bubble: #2f2f2f;
      --shadow: 0 4px 16px -6px rgba(0, 0, 0, 0.5);
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    -webkit-font-smoothing: antialiased;
  }

  /* --- shell + sidebar --- */

  .shell {
    display: flex;
    min-height: 100vh;
    align-items: stretch;
  }

  .sidebar {
    width: 260px;
    flex-shrink: 0;
    background: var(--sidebar-bg);
    padding: 12px 8px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    overflow-y: auto;
  }

  @media (max-width: 900px) {
    .shell { flex-direction: column; }
    .sidebar { width: auto; max-height: 220px; border-bottom: 1px solid var(--border); }
  }

  .sidebar-brand {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 8px 8px 14px;
  }
  .sidebar-brand .mark {
    width: 24px;
    height: 24px;
    border-radius: 6px;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .sidebar-brand .mark svg { width: 14px; height: 14px; fill: #fff; }
  .sidebar-brand span:last-child { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }

  .sidebar-title {
    font-size: 11.5px;
    font-weight: 500;
    color: var(--text-faint);
    padding: 10px 8px 6px;
  }

  .sidebar-list { display: flex; flex-direction: column; gap: 1px; }

  .sidebar-empty { padding: 8px; font-size: 12.5px; color: var(--text-faint); }

  .sidebar-row {
    display: flex;
    align-items: flex-start;
    gap: 4px;
    padding: 9px 8px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    color: var(--text);
    line-height: 1.4;
  }
  .sidebar-row:hover { background: var(--surface-sunken); }
  .sidebar-row .row-text { flex: 1; min-width: 0; }
  .sidebar-row .row-label {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .sidebar-row .row-mode {
    display: block;
    color: var(--text-faint);
    font-size: 11.5px;
    margin-top: 1px;
  }
  .sidebar-row .row-delete {
    flex-shrink: 0;
    color: var(--text-faint);
    font-size: 12px;
    padding: 2px 5px;
    border-radius: 5px;
    opacity: 0;
  }
  .sidebar-row:hover .row-delete { opacity: 1; }
  .sidebar-row .row-delete:hover { color: var(--danger); background: var(--danger-tint); }

  /* --- main column --- */

  .main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    height: 100vh;
    position: sticky;
    top: 0;
  }

  .chat-shell {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
  }

  .conn-pill {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 5px 11px;
    border-radius: 100px;
    border: 1px solid var(--border);
    font-size: 12.5px;
    color: var(--text-muted);
    font-weight: 500;
  }
  .conn-pill .count {
    color: var(--text-faint);
    font-family: var(--font-mono);
    font-size: 11px;
  }
  .conn-pill .count:not(:empty)::before { content: "· "; }

  .led {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--text-faint);
    flex-shrink: 0;
    transition: background-color 200ms ease, box-shadow 200ms ease;
  }
  .led.on-listening { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-tint); }
  .led.on-speaking { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-tint); }
  .led.on-error { background: var(--danger); box-shadow: 0 0 0 3px var(--danger-tint); }

  .mode-toggle {
    display: flex;
    background: var(--surface-sunken);
    border-radius: 8px;
    padding: 3px;
    gap: 2px;
  }
  .mode-btn {
    padding: 6px 14px;
    border: none;
    background: transparent;
    border-radius: 6px;
    font-family: var(--font-ui);
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-muted);
    cursor: pointer;
    transition: background-color 120ms ease, color 120ms ease, box-shadow 120ms ease;
  }
  .mode-btn:hover:not(.active) { color: var(--text); }
  .mode-btn.active { background: var(--bg); color: var(--text); box-shadow: var(--shadow); }
  .mode-btn:disabled { cursor: not-allowed; opacity: 0.6; }

  /* --- settings page --- */

  .settings-view {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }

  .settings-topbar {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .settings-back {
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-family: var(--font-ui);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    padding: 6px 10px;
    border-radius: 8px;
  }
  .settings-back:hover { background: var(--surface-sunken); color: var(--text); }

  .settings-heading { font-size: 14.5px; font-weight: 600; }

  .settings-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 8px 24px 40px;
  }

  .settings-section-title {
    margin: 28px 0 4px;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-faint);
    letter-spacing: 0.01em;
    text-transform: uppercase;
  }
  .settings-section-title:first-child { margin-top: 12px; }

  .settings-body {
    padding: 4px 0 20px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 18px;
    max-width: 820px;
  }

  .field-group {
    display: grid;
    gap: 10px;
    align-content: start;
  }

  .field-group h3 {
    margin: 0;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-faint);
    letter-spacing: 0.01em;
  }

  .field { display: grid; gap: 5px; }

  .field label {
    font-size: 12.5px;
    color: var(--text-muted);
  }

  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  select, input[type="text"], input[type="number"] {
    width: 100%;
    background: var(--surface-sunken);
    border: 1px solid transparent;
    border-radius: 8px;
    color: var(--text);
    font-family: var(--font-ui);
    font-size: 13px;
    padding: 8px 10px;
    outline: none;
    transition: border-color 150ms ease, box-shadow 150ms ease;
  }
  select:focus, input[type="text"]:focus, input[type="number"]:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-tint);
  }
  select:disabled, input:disabled { opacity: 0.5; cursor: not-allowed; }
  input[type="text"]::placeholder { color: var(--text-faint); }
  input[type="number"] { font-variant-numeric: tabular-nums; }

  /* --- chat area --- */

  .chat-scroll {
    flex: 1;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .chat-column {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 24px;
  }

  .transcript { padding: 24px 0 12px; }

  .transcript:empty::before {
    content: "Ask something, or say it out loud once you connect.";
    display: block;
    padding-top: 20vh;
    text-align: center;
    color: var(--text-faint);
    font-size: 14px;
  }

  .line { display: flex; margin-bottom: 16px; }
  .line .who { display: none; }
  .line .what {
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 15px;
    line-height: 1.6;
  }

  .line.you { justify-content: flex-end; }
  .line.you .what {
    background: var(--user-bubble);
    border-radius: 18px;
    padding: 9px 16px;
    max-width: 80%;
  }

  .line.bot .what { max-width: 100%; }

  .line.system {
    justify-content: center;
    margin-bottom: 10px;
  }
  .line.system .what {
    color: var(--text-faint);
    font-size: 12.5px;
    font-style: italic;
  }

  .line-stats {
    font-size: 11px;
    color: var(--text-faint);
    font-family: var(--font-mono);
    margin: -10px 0 16px;
  }
  .line.you + .line-stats { text-align: right; }

  /* --- composer --- */

  .composer-bar {
    border-top: 1px solid var(--border);
    padding: 14px 24px 20px;
    flex-shrink: 0;
  }

  .composer-status {
    display: flex;
    align-items: center;
    gap: 12px;
    max-width: 720px;
    margin: 0 auto;
  }

  .status-tile {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    background: var(--surface-sunken);
    color: var(--text-faint);
    transition: background-color 200ms ease, color 200ms ease;
  }
  .status-tile svg { width: 18px; height: 18px; }

  .status-tile.listening { background: var(--accent-tint); color: var(--accent); }
  .status-tile.speaking { background: var(--accent-tint); color: var(--accent); animation: tile-pulse 1s ease-in-out infinite; }
  .status-tile.error { background: var(--danger-tint); color: var(--danger); }
  .status-tile.muted { background: var(--surface-sunken); color: var(--text-faint); }

  @keyframes tile-pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }
  @media (prefers-reduced-motion: reduce) {
    .status-tile.speaking { animation: none; }
  }

  .status-copy { flex: 1; min-width: 0; }
  .status-copy .state-text { font-size: 13.5px; font-weight: 600; }
  .status-copy .status-label {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 1px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .composer-actions { display: flex; gap: 8px; flex-shrink: 0; }

  button.primary {
    padding: 9px 18px;
    border-radius: 100px;
    border: 1px solid transparent;
    font-family: var(--font-ui);
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    background: var(--text);
    color: var(--bg);
    transition: opacity 120ms ease, transform 80ms ease;
  }
  button.primary:hover:not(:disabled) { opacity: 0.85; }
  button.primary:active:not(:disabled) { transform: scale(0.98); }
  button.primary:disabled { cursor: not-allowed; opacity: 0.4; }

  button.primary.disconnect { background: transparent; color: var(--text-muted); border-color: var(--border); }
  button.primary.disconnect:hover:not(:disabled) { border-color: var(--danger); color: var(--danger); opacity: 1; }

  button.secondary {
    padding: 9px 16px;
    border-radius: 100px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    font-family: var(--font-ui);
    font-size: 13.5px;
    font-weight: 500;
    cursor: pointer;
    transition: border-color 120ms ease, color 120ms ease, background-color 120ms ease;
  }
  button.secondary:hover:not(:disabled) { border-color: var(--text-muted); }
  button.secondary:disabled { cursor: not-allowed; opacity: 0.45; }
  button.secondary.active { border-color: var(--danger); color: var(--danger); background: var(--danger-tint); }

  .text-compose {
    display: flex;
    align-items: center;
    gap: 8px;
    max-width: 720px;
    margin: 12px auto 0;
    background: var(--surface-sunken);
    border-radius: 26px;
    padding: 6px 6px 6px 18px;
  }
  .text-compose input[type="text"] {
    flex: 1;
    background: transparent;
    border: none;
    padding: 8px 0;
    font-size: 14.5px;
  }
  .text-compose input[type="text"]:focus { box-shadow: none; }
  .text-compose button.primary { flex: none; }

  /* --- model chip (opens Settings) --- */

  .model-chip-row {
    max-width: 720px;
    margin: 0 auto 8px;
    display: flex;
    justify-content: center;
  }
  .model-chip {
    border: 1px solid var(--border);
    background: var(--surface-sunken);
    color: var(--text-muted);
    font-family: var(--font-ui);
    font-size: 12px;
    font-weight: 500;
    padding: 5px 13px;
    border-radius: 100px;
    cursor: pointer;
    transition: border-color 120ms ease, color 120ms ease;
  }
  .model-chip:hover { border-color: var(--text-muted); color: var(--text); }

  /* --- connections graph --- */

  .connections-status {
    font-size: 12.5px;
    color: var(--text-faint);
    margin-top: 8px;
  }
  .connections-graph {
    width: 100%;
    height: 320px;
    margin-top: 10px;
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }

  /* --- tool trace --- */

  .tool-trace {
    font-size: 11px;
    color: var(--text-faint);
    font-family: var(--font-mono);
    margin: -10px 0 16px;
  }
  .line.you + .tool-trace { text-align: right; }
  .tool-trace summary { cursor: pointer; list-style: none; }
  .tool-trace summary::-webkit-details-marker { display: none; }
  .tool-trace summary:hover { color: var(--text-muted); }
  .tool-trace-row {
    display: grid;
    grid-template-columns: auto auto 1fr;
    gap: 8px;
    padding: 6px 0 0 12px;
    align-items: baseline;
  }
  .tool-trace-name { color: var(--text-muted); font-weight: 600; }
  .tool-trace-args { color: var(--text-faint); }
  .tool-trace-result {
    color: var(--text-muted);
    white-space: pre-wrap;
    word-break: break-word;
  }
</style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <span class="mark"><svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z"/></svg></span>
        <span>Voice Agent</span>
      </div>
      <div class="sidebar-title" id="historyTitle">History</div>
      <div class="sidebar-list" id="historyBody"></div>
    </aside>

    <div class="main">
      <div class="chat-shell" id="chatShell">
        <div class="topbar">
          <div class="mode-toggle" role="group" aria-label="Session mode">
            <button type="button" class="mode-btn active" id="modeVoiceBtn">Voice</button>
            <button type="button" class="mode-btn" id="modeTextBtn">Text</button>
          </div>
          <div class="conn-pill">
            <span class="led" id="led"></span><span id="stateText">Disconnected</span>
            <span class="count" id="lineCount"></span>
          </div>
        </div>

        <div class="chat-scroll">
          <div class="chat-column">
            <div class="transcript" id="transcript"></div>
          </div>
        </div>

        <div class="composer-bar">
          <div class="model-chip-row">
            <button type="button" class="model-chip" id="modelChip">Model: —</button>
          </div>
          <div class="composer-status">
            <div class="status-tile" id="ring"><span id="ringIcon"></span></div>
            <div class="status-copy">
              <div class="state-text" id="stateTextCard">Disconnected</div>
              <div class="status-label" id="statusLabel">Not connected</div>
            </div>
            <div class="composer-actions">
              <button class="primary" id="connectBtn">Connect</button>
              <button class="secondary" id="muteBtn" disabled>Mute</button>
            </div>
          </div>
          <div class="text-compose" id="textCompose" hidden>
            <input type="text" id="textInput" placeholder="Message the assistant…" disabled>
            <button class="primary" id="textSendBtn" disabled>Send</button>
          </div>
        </div>
      </div>

      <div class="settings-view" id="settingsView" hidden>
        <div class="settings-topbar">
          <button type="button" class="settings-back" id="settingsBackBtn">&larr; Back</button>
          <div class="settings-heading">Settings</div>
        </div>
        <div class="settings-scroll">
          <div class="settings-body" id="configPanel">
            <div class="field-group">
              <h3>Model</h3>
              <div id="voiceEngineFields">
                <div class="field">
                  <label for="ttsEngine">Voice engine</label>
                  <select id="ttsEngine"></select>
                </div>
                <div class="field">
                  <label for="ttsVoice">Voice</label>
                  <select id="ttsVoice"></select>
                </div>
              </div>
              <div class="field">
                <label for="llmModel">LLM model</label>
                <select id="llmModel"></select>
              </div>
            </div>

            <div class="field-group" id="inputGroup">
              <h3>Input</h3>
              <div class="field">
                <label for="micSelect">Microphone</label>
                <select id="micSelect"><option value="">System default</option></select>
              </div>
              <div class="field">
                <label for="triggerWord">Wake word (optional)</label>
                <input type="text" id="triggerWord" placeholder="e.g. computer">
              </div>
            </div>

            <div class="field-group" id="vadGroup">
              <h3>Voice detection</h3>
              <div class="field">
                <label for="vadThreshold">Sensitivity (0&ndash;1)</label>
                <input type="number" id="vadThreshold" min="0" max="1" step="0.05" value="0.5">
              </div>
              <div class="field-row">
                <div class="field">
                  <label for="vadMinSilenceMs">Pause length (ms)</label>
                  <input type="number" id="vadMinSilenceMs" min="0" step="100" value="1200">
                </div>
                <div class="field">
                  <label for="vadSpeechPadMs">Speech padding (ms)</label>
                  <input type="number" id="vadSpeechPadMs" min="0" step="50" value="300">
                </div>
              </div>
            </div>
          </div>

          <div class="settings-section-title">Connections</div>
          <div class="field-group">
            <div id="connectionsStatus" class="connections-status"></div>
            <div id="connectionsGraph" class="connections-graph"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
(() => {
  const el = (id) => document.getElementById(id);
  const led = el("led"), ring = el("ring"), ringIcon = el("ringIcon");
  const stateText = el("stateText"), stateTextCard = el("stateTextCard"), statusLabel = el("statusLabel");
  const configPanel = el("configPanel"), connectBtn = el("connectBtn"), muteBtn = el("muteBtn");
  const ttsEngineSel = el("ttsEngine"), ttsVoiceSel = el("ttsVoice"), llmModelSel = el("llmModel");
  const triggerInput = el("triggerWord"), micSelect = el("micSelect");
  const vadThresholdInput = el("vadThreshold"), vadMinSilenceInput = el("vadMinSilenceMs"), vadSpeechPadInput = el("vadSpeechPadMs");
  const transcript = el("transcript"), lineCount = el("lineCount");
  const chatShell = el("chatShell"), settingsView = el("settingsView"), settingsBackBtn = el("settingsBackBtn");
  const modelChip = el("modelChip");
  const connectionsStatus = el("connectionsStatus"), connectionsGraph = el("connectionsGraph");
  const historyTitle = el("historyTitle"), historyBody = el("historyBody");
  const modeVoiceBtn = el("modeVoiceBtn"), modeTextBtn = el("modeTextBtn");
  const voiceEngineFields = el("voiceEngineFields"), inputGroup = el("inputGroup"), vadGroup = el("vadGroup");
  const textCompose = el("textCompose"), textInput = el("textInput"), textSendBtn = el("textSendBtn");

  const ICONS = {
    idle: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z" opacity="0.5"/></svg>',
    listening: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z"/></svg>',
    speaking: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="10" width="2.5" height="4" rx="1"/><rect x="9" y="6" width="2.5" height="12" rx="1"/><rect x="14" y="3" width="2.5" height="18" rx="1"/><rect x="19" y="8" width="2.5" height="8" rx="1"/></svg>',
    muted: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.5 12a4.5 4.5 0 0 0-.2-1.3l-1.5 1.5v-.2H12.8L16.5 15.7A4.48 4.48 0 0 0 16.5 12ZM19 12a7 7 0 0 1-.68 3l1.45 1.45A8.96 8.96 0 0 0 21 12h-2ZM4.27 3 3 4.27l6 6V12a3 3 0 0 0 4.55 2.57l1.2 1.2A4.98 4.98 0 0 1 7 12H5a7 7 0 0 0 6 6.92V21h2v-2.08a6.96 6.96 0 0 0 2.61-.88L19.73 22 21 20.73 4.27 3ZM15 6a3 3 0 0 0-6 0v1.79l6 6V6Z"/></svg>',
    error: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 1 21h22L12 2Zm1 15h-2v2h2v-2Zm0-7h-2v5h2v-5Z"/></svg>',
  };

  let currentMode = "voice";

  function isTextMode() {
    return currentMode === "text";
  }

  function setMode(mode) {
    currentMode = mode;
    modeVoiceBtn.classList.toggle("active", mode === "voice");
    modeTextBtn.classList.toggle("active", mode === "text");
    const textMode = mode === "text";
    voiceEngineFields.hidden = textMode;
    inputGroup.hidden = textMode;
    vadGroup.hidden = textMode;
  }

  modeVoiceBtn.onclick = () => setMode("voice");
  modeTextBtn.onclick = () => setMode("text");

  // --- settings page routing (hash-based, no server route --
  // #/settings survives refresh/back-forward without a new endpoint) ---

  function isSettingsRoute() {
    return location.hash === "#/settings";
  }

  function applyRoute() {
    const showSettings = isSettingsRoute();
    chatShell.hidden = showSettings;
    settingsView.hidden = !showSettings;
    if (showSettings) ensureConnectionsGraphLoaded();
  }

  window.addEventListener("hashchange", applyRoute);
  settingsBackBtn.onclick = () => { location.hash = ""; };
  modelChip.onclick = () => { location.hash = "#/settings"; };

  function updateModelChip() {
    if (!options) return;
    modelChip.textContent = `Model: ${options.provider.name} · ${llmModelSel.value}`;
  }

  let options = null;
  let ws = null, connected = false, micMuted = false, currentState = "idle";
  let audioCtx, micStream, source, processor, playCtx;
  let outputSampleRate = 16000;
  let nextPlayTime = 0; // running Web Audio timeline cursor for gapless playback scheduling
  let turnCount = 0;
  let pendingResumeSessionId = null;
  let totalTokens = 0, totalCost = 0, totalCostKnown = false;

  function formatUsageLine(usage, latency) {
    const parts = [];
    if (latency) parts.push(`${latency.ttft.toFixed(2)}s ttft / ${latency.total.toFixed(2)}s total`);
    if (usage) {
      if (usage.input_tokens != null && usage.output_tokens != null) {
        const totalPart = usage.context_window != null
          ? `${usage.total_tokens} total / ${usage.context_window} ctx`
          : `${usage.total_tokens} total`;
        parts.push(`${usage.input_tokens} in / ${usage.output_tokens} out (${totalPart})`);
      }
      if (usage.cost_usd != null) parts.push(`$${usage.cost_usd.toFixed(4)}`);
    }
    return parts.join(" · ");
  }

  const TRACE_RESULT_MAX_CHARS = 200;

  function buildToolTrace(usage) {
    if (!usage || !usage.tool_calls || !usage.tool_calls.length) return null;
    const details = document.createElement("details");
    details.className = "tool-trace";
    const summary = document.createElement("summary");
    summary.textContent = `tools: ${usage.tool_calls.map((c) => c.name).join(", ")}`;
    details.appendChild(summary);
    for (const call of usage.tool_calls) {
      const row = document.createElement("div");
      row.className = "tool-trace-row";
      const name = document.createElement("span");
      name.className = "tool-trace-name";
      name.textContent = call.name;
      const args = document.createElement("span");
      args.className = "tool-trace-args";
      args.textContent = JSON.stringify(call.args ?? {});
      const result = document.createElement("span");
      result.className = "tool-trace-result";
      const resultStr = call.result != null ? String(call.result) : "";
      result.textContent = resultStr.length > TRACE_RESULT_MAX_CHARS
        ? resultStr.slice(0, TRACE_RESULT_MAX_CHARS) + "…"
        : resultStr;
      row.append(name, args, result);
      details.appendChild(row);
    }
    return details;
  }

  function updateSessionTotals(usage) {
    if (usage.total_tokens != null) totalTokens += usage.total_tokens;
    if (usage.cost_usd != null) { totalCost += usage.cost_usd; totalCostKnown = true; }
    const tokenPart = totalTokens ? `${totalTokens.toLocaleString()} tokens` : "";
    const costPart = totalCostKnown ? `$${totalCost.toFixed(4)}` : "";
    lineCount.textContent = [tokenPart, costPart].filter(Boolean).join(" · ")
      || (turnCount ? `${turnCount}${turnCount === 1 ? " message" : " messages"}` : "");
  }

  // --- helpers ---

  function floatToPcm16(input) {
    const out = new Int16Array(input.length);
    for (let i = 0; i < input.length; i++) {
      const s = Math.max(-1, Math.min(1, input[i]));
      out[i] = s < 0 ? s * 32768 : s * 32767;
    }
    return out.buffer;
  }

  function pcm16ToFloat(buf) {
    const view = new Int16Array(buf);
    const out = new Float32Array(view.length);
    for (let i = 0; i < view.length; i++) out[i] = view[i] / 32768;
    return out;
  }

  function rms(float32) {
    let sum = 0;
    for (let i = 0; i < float32.length; i++) sum += float32[i] * float32[i];
    return Math.sqrt(sum / float32.length);
  }

  function addLine(who, text, usage, latency) {
    const line = document.createElement("div");
    line.className = "line " + who;
    const label = { you: "You", bot: "Bot", system: "—" }[who] || who;
    line.innerHTML = `<span class="who">${label}</span><span class="what"></span>`;
    line.querySelector(".what").textContent = text;
    transcript.appendChild(line);

    if (usage || latency) {
      const statsLine = formatUsageLine(usage, latency);
      if (statsLine) {
        const stats = document.createElement("div");
        stats.className = "line-stats";
        stats.textContent = statsLine;
        transcript.appendChild(stats);
      }
      const trace = buildToolTrace(usage);
      if (trace) transcript.appendChild(trace);
      if (usage) updateSessionTotals(usage);
    }

    transcript.scrollTop = transcript.scrollHeight;
    if (who === "you" || who === "bot") {
      turnCount++;
      if (!usage) lineCount.textContent = turnCount + (turnCount === 1 ? " message" : " messages");
    }
  }

  function setState(state, label) {
    currentState = state;
    led.className = "led" + (state === "listening" ? " on-listening" : state === "speaking" ? " on-speaking" : state === "error" ? " on-error" : "");
    ring.className = "status-tile" + (state === "listening" ? " listening" : state === "speaking" ? " speaking" : state === "error" ? " error" : state === "muted" ? " muted" : "");
    ringIcon.innerHTML = ICONS[state] || ICONS.idle;
    const text = { idle: "Disconnected", connecting: "Connecting…", listening: "Listening", speaking: "Speaking", muted: "Muted", error: "Error" }[state] || state;
    stateText.textContent = text;
    stateTextCard.textContent = text;
    statusLabel.textContent = label;
  }

  function refreshIdleState() {
    if (!connected) return;
    if (micMuted) setState("muted", "Microphone is muted");
    else setState("listening", "Listening — just start talking");
  }

  // --- /options ---

  async function loadOptions() {
    const res = await fetch("/options");
    options = await res.json();

    ttsEngineSel.innerHTML = "";
    for (const engine of Object.keys(options.tts)) {
      const o = document.createElement("option");
      o.value = engine; o.textContent = engine;
      ttsEngineSel.appendChild(o);
    }
    ttsEngineSel.value = options.defaults.tts_engine;
    populateVoices();

    llmModelSel.innerHTML = "";
    for (const model of options.llm_models) {
      const o = document.createElement("option");
      o.value = model; o.textContent = model;
      llmModelSel.appendChild(o);
    }
    llmModelSel.value = options.defaults.llm_model;
    updateModelChip();
  }

  function populateVoices() {
    const voices = options.tts[ttsEngineSel.value] || [];
    ttsVoiceSel.innerHTML = "";
    for (const voice of voices) {
      const o = document.createElement("option");
      o.value = voice; o.textContent = voice;
      ttsVoiceSel.appendChild(o);
    }
  }

  ttsEngineSel.addEventListener("change", populateVoices);
  llmModelSel.addEventListener("change", updateModelChip);

  // --- speaking detection: real signal in incoming audio, not just "any frame arrived"
  // (the sink streams continuously, silence included, once connected) ---

  let lastLoudAt = 0;
  let speakingCheckTimer = null;
  const LOUD_RMS = 0.01;
  const SPEAKING_HANGOVER_MS = 400;

  function noteIncomingAudio(float32) {
    if (rms(float32) > LOUD_RMS) {
      lastLoudAt = Date.now();
      if (connected) setState("speaking", "The assistant is talking");
    }
  }

  function startSpeakingWatchdog() {
    speakingCheckTimer = setInterval(() => {
      if (!connected) return;
      if (Date.now() - lastLoudAt > SPEAKING_HANGOVER_MS) refreshIdleState();
    }, 120);
  }

  function stopSpeakingWatchdog() {
    if (speakingCheckTimer) clearInterval(speakingCheckTimer);
    speakingCheckTimer = null;
  }

  // --- microphone selection ---

  async function populateMics() {
    try {
      const devices = await navigator.mediaDevices.enumerateDevices();
      const mics = devices.filter((d) => d.kind === "audioinput");
      const current = micSelect.value;
      micSelect.innerHTML = '<option value="">System default</option>';
      mics.forEach((d, i) => {
        const o = document.createElement("option");
        o.value = d.deviceId;
        o.textContent = d.label || `Microphone ${i + 1}`;
        micSelect.appendChild(o);
      });
      if (current) micSelect.value = current;
    } catch (e) {
      // enumerateDevices can fail (insecure context, unsupported browser) —
      // leave just the "System default" option, still fully usable.
    }
  }

  if (navigator.mediaDevices) navigator.mediaDevices.ondevicechange = populateMics;

  // --- mute ---

  function setMuted(value) {
    micMuted = value;
    muteBtn.textContent = micMuted ? "Unmute" : "Mute";
    muteBtn.classList.toggle("active", micMuted);
    if (micStream) micStream.getAudioTracks().forEach((t) => (t.enabled = !micMuted));
    if (currentState !== "speaking") refreshIdleState();
  }

  muteBtn.onclick = () => setMuted(!micMuted);

  // --- connect / disconnect ---

  async function connect() {
    connectBtn.disabled = true;
    const textMode = isTextMode();

    if (!textMode) {
      setState("connecting", "Opening the microphone…");
      const audioConstraints = micSelect.value ? { deviceId: { exact: micSelect.value } } : true;
      try {
        micStream = await navigator.mediaDevices.getUserMedia({ audio: audioConstraints });
      } catch (e) {
        setState("error", "Microphone access was denied");
        connectBtn.disabled = false;
        return;
      }
      populateMics(); // refresh with real labels now that permission is granted
    } else {
      setState("connecting", "Connecting…");
    }

    const params = new URLSearchParams();
    params.set("mode", textMode ? "text" : "voice");
    params.set("tts", ttsEngineSel.value);
    if (ttsVoiceSel.value) params.set("voice", ttsVoiceSel.value);
    params.set("llm_model", llmModelSel.value);
    if (triggerInput.value.trim()) params.set("trigger_word", triggerInput.value.trim());
    if (vadThresholdInput.value.trim()) params.set("vad_threshold", vadThresholdInput.value.trim());
    if (vadMinSilenceInput.value.trim()) params.set("vad_min_silence_ms", vadMinSilenceInput.value.trim());
    if (vadSpeechPadInput.value.trim()) params.set("vad_speech_pad_ms", vadSpeechPadInput.value.trim());
    const resumeSessionId = pendingResumeSessionId;
    if (resumeSessionId) params.set("resume_session_id", resumeSessionId);
    pendingResumeSessionId = null;

    const proto = location.protocol === "https:" ? "wss:" : "ws:";
    ws = new WebSocket(`${proto}//${location.host}/ws?${params.toString()}`);
    ws.binaryType = "arraybuffer";

    ws.onopen = () => {
      // A resumed session's prior turns were already rendered (by
      // continueSession(), before connect() was even called) — clearing
      // here would wipe them out right as the connection opens.
      if (!resumeSessionId) {
        transcript.innerHTML = "";
        turnCount = 0;
        totalTokens = 0;
        totalCost = 0;
        totalCostKnown = false;
        lineCount.textContent = "";
      }
    };

    ws.onclose = () => { if (connected) disconnect("Connection closed"); };
    ws.onerror = () => { setState("error", "Connection error"); };

    ws.onmessage = (event) => {
      if (typeof event.data === "string") {
        const msg = JSON.parse(event.data);
        handleEvent(msg);
        return;
      }
      const floatData = pcm16ToFloat(event.data);
      noteIncomingAudio(floatData);
      if (playCtx && floatData.length) {
        const buffer = playCtx.createBuffer(1, floatData.length, outputSampleRate);
        buffer.copyToChannel(floatData, 0);
        const src = playCtx.createBufferSource();
        src.buffer = buffer;
        src.connect(playCtx.destination);
        // Schedule back-to-back on a running timeline instead of
        // src.start() (= "play now" on every ~40ms block) — network
        // delivery isn't perfectly metronomic, so "now" causes
        // consecutive blocks to overlap or leave gaps at every boundary,
        // which is exactly what audible crackling sounds like. Falls
        // back to "now" naturally if playback ever falls behind (a gap
        // in the stream), since Math.max keeps it from scheduling in
        // the past.
        const startAt = Math.max(playCtx.currentTime, nextPlayTime);
        src.start(startAt);
        nextPlayTime = startAt + buffer.duration;
      }
    };

    if (!textMode) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
      source = audioCtx.createMediaStreamSource(micStream);
      processor = audioCtx.createScriptProcessor(512, 1, 1);
      processor.onaudioprocess = (e) => {
        if (!micMuted && ws && ws.readyState === WebSocket.OPEN) {
          ws.send(floatToPcm16(e.inputBuffer.getChannelData(0)));
        }
      };
      source.connect(processor);
      processor.connect(audioCtx.destination);
    }
  }

  function sendText() {
    const value = textInput.value.trim();
    if (!value || !ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({ text: value }));
    textInput.value = "";
  }

  textSendBtn.onclick = sendText;
  textInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendText();
  });

  function handleEvent(msg) {
    if (msg.event === "ready") {
      const textMode = isTextMode();
      if (!textMode) {
        outputSampleRate = msg.output_sample_rate;
        playCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: outputSampleRate });
        nextPlayTime = 0;
      }
      connected = true;
      configPanel.querySelectorAll("select, input").forEach((f) => (f.disabled = true));
      modeVoiceBtn.disabled = true;
      modeTextBtn.disabled = true;
      if (isSettingsRoute()) location.hash = "";
      connectBtn.textContent = "Disconnect";
      connectBtn.classList.add("disconnect");
      connectBtn.disabled = false;
      connectBtn.onclick = () => disconnect();
      if (textMode) {
        textCompose.hidden = false;
        textInput.disabled = false;
        textSendBtn.disabled = false;
        textInput.focus();
        setState("listening", "Type a message below");
      } else {
        muteBtn.disabled = false;
        setState("listening", "Listening — just start talking");
        startSpeakingWatchdog();
      }
      refreshHistoryList().catch(() => {});
    } else if (msg.event === "user_text") {
      addLine("you", msg.text);
    } else if (msg.event === "bot_text") {
      addLine("bot", msg.text, msg.usage, msg.latency);
      // The session's title (generated server-side after the first
      // exchange) may have just landed — refresh the sidebar row for it.
      // A short delay since generation happens off-thread, after this
      // event is sent, not before it.
      setTimeout(() => refreshHistoryList().catch(() => {}), 1500);
    } else if (msg.event === "interrupted") {
      addLine("system", "Interrupted");
    } else if (msg.event === "error") {
      disconnect(msg.message || "Server rejected the connection");
    }
  }

  function disconnect(reason) {
    connected = false;
    setMuted(false);
    muteBtn.disabled = true;
    textCompose.hidden = true;
    textInput.disabled = true;
    textSendBtn.disabled = true;
    stopSpeakingWatchdog();
    if (processor) { processor.disconnect(); processor = null; }
    if (source) { source.disconnect(); source = null; }
    if (micStream) { micStream.getTracks().forEach((t) => t.stop()); micStream = null; }
    if (ws) { ws.onclose = null; ws.close(); ws = null; }

    configPanel.querySelectorAll("select, input").forEach((f) => (f.disabled = false));
    modeVoiceBtn.disabled = false;
    modeTextBtn.disabled = false;
    connectBtn.textContent = "Connect";
    connectBtn.classList.remove("disconnect");
    connectBtn.disabled = false;
    connectBtn.onclick = connect;
    setState("idle", reason || "Not connected");
  }

  // --- history sidebar ---

  function formatSessionTimestamp(iso) {
    try {
      return new Date(iso).toLocaleString(undefined, {
        month: "short", day: "numeric", hour: "numeric", minute: "2-digit",
      });
    } catch (e) {
      return iso;
    }
  }

  async function refreshHistoryList() {
    historyTitle.textContent = "History";
    const sessions = await (await fetch("/sessions")).json();
    historyBody.innerHTML = "";
    if (!sessions.length) {
      const empty = document.createElement("div");
      empty.className = "sidebar-empty";
      empty.textContent = "No past sessions yet.";
      historyBody.appendChild(empty);
      return;
    }
    for (const s of sessions) {
      const row = document.createElement("div");
      row.className = "sidebar-row";

      const textBlock = document.createElement("div");
      textBlock.className = "row-text";
      const title = document.createElement("div");
      title.className = "row-label";
      title.textContent = s.title || formatSessionTimestamp(s.created_at);
      textBlock.appendChild(title);
      const meta = document.createElement("span");
      meta.className = "row-mode";
      meta.textContent = `${s.mode} · ${s.turn_count} turn${s.turn_count === 1 ? "" : "s"}`;
      textBlock.appendChild(meta);
      row.appendChild(textBlock);

      const delBtn = document.createElement("span");
      delBtn.className = "row-delete";
      delBtn.textContent = "✕";
      delBtn.title = "Delete this chat";
      delBtn.onclick = async (e) => {
        e.stopPropagation();
        if (!confirm("Delete this chat? This can't be undone.")) return;
        await fetch(`/sessions/${s.id}`, { method: "DELETE" });
        refreshHistoryList();
      };
      row.appendChild(delBtn);

      row.onclick = () => continueSession(s.id);
      historyBody.appendChild(row);
    }
  }

  async function continueSession(sessionId) {
    const detail = await (await fetch(`/sessions/${sessionId}`)).json();
    if (connected) disconnect();

    setMode(detail.session.mode);
    transcript.innerHTML = "";
    turnCount = 0;
    totalTokens = 0;
    totalCost = 0;
    totalCostKnown = false;
    lineCount.textContent = "";
    for (const turn of detail.turns) {
      addLine(turn.role === "user" ? "you" : "bot", turn.text, turn.usage);
    }
    pendingResumeSessionId = sessionId;
    connect();
  }

  // --- connections graph (React Flow, lazy-loaded via CDN on first
  // Settings visit -- this app otherwise runs fully offline (local
  // STT/TTS/LLM), so this is the one feature that needs internet, and
  // it's isolated so a failure here can't affect anything else) ---

  const REACT_VERSION = "18.3.1";
  const XYFLOW_VERSION = "12.11.6";
  let connectionsGraphState = "idle"; // idle | loading | loaded | error

  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = src;
      s.crossOrigin = "anonymous";
      s.onload = () => resolve();
      s.onerror = () => reject(new Error(`failed to load ${src}`));
      document.head.appendChild(s);
    });
  }

  function loadStylesheet(href) {
    return new Promise((resolve, reject) => {
      const link = document.createElement("link");
      link.rel = "stylesheet";
      link.href = href;
      link.onload = () => resolve();
      link.onerror = () => reject(new Error(`failed to load ${href}`));
      document.head.appendChild(link);
    });
  }

  function renderConnectionsGraph() {
    const { ReactFlow, Background } = window.ReactFlow;
    const providerLabel = `${options.provider.name} · ${options.provider.model}`;
    const nodes = [
      { id: "provider", position: { x: 260, y: 0 }, data: { label: providerLabel } },
      ...options.tools.map((t, i) => ({
        id: t.name,
        position: { x: i * 240, y: 150 },
        data: { label: t.enabled ? t.label : `${t.label} (disabled)` },
        style: t.enabled ? {} : { opacity: 0.45 },
      })),
    ];
    const edges = options.tools.map((t) => ({
      id: `provider-${t.name}`, source: "provider", target: t.name, animated: t.enabled,
    }));

    const root = ReactDOM.createRoot(connectionsGraph);
    root.render(
      React.createElement(
        ReactFlow,
        { nodes, edges, fitView: true, nodesDraggable: false, nodesConnectable: false, elementsSelectable: false },
        React.createElement(Background, null)
      )
    );
  }

  function ensureConnectionsGraphLoaded() {
    if (connectionsGraphState !== "idle") return;
    if (!options) {
      // /options hasn't resolved yet (unlikely by the time a user
      // navigates here, but possible on a direct #/settings load) --
      // retry once it has, without spamming the CDN meanwhile.
      loadOptionsPromise.then(ensureConnectionsGraphLoaded).catch(() => {});
      return;
    }
    connectionsGraphState = "loading";
    connectionsStatus.textContent = "Loading diagram…";

    loadScript(`https://unpkg.com/react@${REACT_VERSION}/umd/react.development.js`)
      .then(() => loadScript(`https://unpkg.com/react-dom@${REACT_VERSION}/umd/react-dom.development.js`))
      .then(() => {
        // @xyflow/react's UMD build is compiled against the automatic
        // JSX runtime internally, even though we call React.createElement
        // ourselves below -- it expects this global to exist.
        window.jsxRuntime = { jsx: React.createElement, jsxs: React.createElement, Fragment: React.Fragment };
        return loadScript(`https://unpkg.com/@xyflow/react@${XYFLOW_VERSION}/dist/umd/index.js`);
      })
      .then(() => loadStylesheet(`https://unpkg.com/@xyflow/react@${XYFLOW_VERSION}/dist/style.css`))
      .then(() => {
        connectionsGraphState = "loaded";
        connectionsStatus.textContent = "";
        renderConnectionsGraph();
      })
      .catch(() => {
        connectionsGraphState = "error";
        connectionsStatus.textContent = "Couldn't load the connections diagram (no internet?).";
      });
  }

  setMode("voice");
  connectBtn.onclick = connect;
  setState("idle", "Not connected");
  const loadOptionsPromise = loadOptions().catch(() => setState("error", "Couldn't reach the server for options"));
  applyRoute();
  populateMics();
  refreshHistoryList().catch(() => {
    historyBody.innerHTML = "";
    const err = document.createElement("div");
    err.className = "sidebar-empty";
    err.textContent = "Couldn't load history.";
    historyBody.appendChild(err);
  });
})();
</script>
</body>
</html>
