[project]
name = "pos-harness"
version = "0.1.0"
description = "Full-duplex local speech-to-speech voice agent (VAD/STT/LLM/TTS) with barge-in, session history, and a browser or CLI client."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "argon2-cffi>=25.1.0",
    "cryptography>=46.0.0",
    "email-validator>=2.2.0",
    "fastapi>=0.141.1",
    "huggingface-hub>=1.30.0",
    "langchain[anthropic,aws,google-genai]>=1.3.2",
    "langchain-openai>=1.6.2",
    "langchain-tavily>=0.2.18",
    "numpy>=2.5.3",
    "onnx-asr[cpu,hub]>=0.12.0",
    "onnxruntime>=1.29.0",
    "openai>=3.8.0",
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2.0",
    "pyjwt>=2.10.0",
    "requests>=2.34.2",
    "sherpa-onnx>=1.13.7",
    "silero-vad>=6.2.1",
    "sounddevice>=0.5.6",
    "torch",
    "torchaudio",
    "ttstokenizer>=1.1.0",
    "uvicorn[standard]>=0.52.4",
    "websockets>=17.1",
    "langchain-openrouter>=0.2.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pos"]

# silero-vad pulls in torch, and the default Linux torch wheel on PyPI
# depends on the nvidia-* CUDA runtime packages (~2-3GB) even though
# nothing here uses a GPU -- everything runs on CPU via ONNX Runtime.
# Pin torch/torchaudio to PyTorch's own CPU-only wheel index instead.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
pos-agent = "pos.cli.local:main"
pos-server = "pos.cli.server:run"
pos-client = "pos.cli.relay_client:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.ruff]
line-length = 120   # generous on purpose -- matches this codebase's existing
                    # style of long, explanatory inline comments (many already
                    # run 100-118 chars); a hard 79/88 would flag most of them
target-version = "py314"

[tool.ruff.lint]
# E/F: pyflakes+pycodestyle core (unused imports/vars, undefined names, ...)
# I: import sorting; UP: pyupgrade (modern syntax); B: bugbear (common footguns)
select = ["E", "F", "I", "UP", "B"]
