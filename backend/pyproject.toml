[project]
name = "pos-backend"
version = "0.1.0"
description = "Single-user local agent server built on LangChain's create_agent."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "deepagents>=0.7.15",
    "defusedxml>=0.7.1",
    "fastapi>=0.141.1",
    "langchain>=1.4.2",
    "langchain-openai>=1.6.2",
    "langchain-tavily>=0.2.18",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "lxml>=6.1.3",
    "markitdown>=0.1.8",
    "numpy>=2.5.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pdf2image>=1.17.0",
    "pdfplumber>=0.11.10",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "python-pptx>=1.0.2",
    "reportlab>=5.0.1",
    "uvicorn[standard]>=0.52.4",
]

# `pos` starts the server and opens the app -- this is what makes
# `uvx pos-backend` and `uv tool install` work.
[project.scripts]
pos = "pos.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pos"]
# src/pos/web/ is build output, not source: it is created by the hook below
# and left out of the repo, so hatchling has to be told to ship it.
artifacts = ["src/pos/web/**"]
# skills/ and memory/ sit beside the package in the repo (they are content,
# not code, and are edited by hand) but must travel *inside* it once
# installed -- agent.py looks in both places.
force-include = { "skills" = "pos/skills", "memory" = "pos/memory" }

# Runs `next build` and copies its output into the package (see
# hatch_build.py), so the wheel carries the UI and the user needs no Node.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"
