[project]
name = "pos-backend"
version = "0.1.0"
description = "Single-user local agent server built on LangChain's create_agent."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "deepagents>=0.7.15",
    "defusedxml>=0.7.1",
    "fastapi>=0.141.1",
    "langchain>=1.4.2",
    "langchain-openai>=1.6.2",
    "langchain-tavily>=0.2.18",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "lxml>=6.1.3",
    "markitdown>=0.1.8",
    "numpy>=2.5.3",
    "openpyxl>=3.1.5",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "python-pptx>=1.0.2",
    "uvicorn[standard]>=0.52.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pos"]
