[project]
name = "asr-test"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "huggingface-hub>=1.30.0",
    "numpy>=2.5.3",
    "onnx-asr[cpu,hub]>=0.12.0",
    "onnxruntime>=1.29.0",
    "openai>=3.8.0",
    "requests>=2.34.2",
    "sherpa-onnx>=1.13.7",
    "silero-vad>=6.2.1",
    "sounddevice>=0.5.6",
    "ttstokenizer>=1.1.0",
    "uvicorn[standard]>=0.52.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asr_test"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
