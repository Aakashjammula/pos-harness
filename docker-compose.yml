# Runs the app in a container.
#
# This is for deploying it somewhere, NOT for daily use on your own machine.
# A container has no display, so the native folder picker cannot open, and
# `execute` runs inside the container rather than on your computer. The agent
# sees only what WORKSPACE mounts.
#
#   WORKSPACE=C:/Users/me/projects docker compose up --build
#
# One service, not two: the backend serves the built UI as well as the API
# (see the `ui` stage in backend/Dockerfile), so there is no second server to
# run and no CORS between them.

services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      # Azure and Tavily credentials. Never baked into the image.
      - backend/.env
    environment:
      POS_DATA_DIR: /data
      POS_ROOT_DIR: /workspace
    volumes:
      # The folder the agent works in. Mount a parent directory to be able to
      # switch between projects without editing this file.
      - ${WORKSPACE:-./workspace}:/workspace
      # Chats and checkpoints, kept outside the container so they survive a
      # rebuild.
      - pos-data:/data
    ports:
      # Loopback by default: this app has no authentication, and the agent can
      # run shell commands. Set BIND_ADDRESS deliberately, if at all.
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/tools')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pos-data:
